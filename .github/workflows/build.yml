name: Compilează APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Teste și compilare
        run: |
          set +e
          gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$( { grep -E '^e: |FAILED|AssertionError|expected' build.log | head -25; sed -n '/What went wrong/,/^\* Try/p' build.log | head -25; } | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' )
            echo "::error title=Eroare la compilare sau teste::${msg}"
          fi
          exit $code

      - name: Pregătește fișierul APK
        run: cp app/build/outputs/apk/release/app-release.apk xperia-battery-monitor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: xperia-battery-monitor
          path: xperia-battery-monitor.apk

      - name: Publică versiunea (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Versiunea 1.0.${{ github.run_number }}
          files: xperia-battery-monitor.apk
          make_latest: true

  verificare-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compilează versiunea de verificare
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Activează KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rulează în emulator Android 15 și face capturi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash ci/screenshots.sh

      - name: Publică capturile pe ramura ci-screenshots
        if: always()
        run: |
          cd shots
          git init -q -b ci-screenshots
          git add .
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "Capturi de ecran din emulator"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin ci-screenshots
