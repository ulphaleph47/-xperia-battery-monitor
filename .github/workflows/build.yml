name: Compilează APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compilează
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Pregătește fișierul APK
        run: cp app/build/outputs/apk/release/app-release.apk xperia-battery-monitor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: xperia-battery-monitor
          path: xperia-battery-monitor.apk

      - name: Publică versiunea (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Versiunea 1.0.${{ github.run_number }}
          files: xperia-battery-monitor.apk
          make_latest: true
